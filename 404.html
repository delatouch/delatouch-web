<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Delatouch</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/favicon.png" type="image/png">
<meta name="color-scheme" content="dark">
<style>
  :root{--ink:#0B0B10;--paper:#EFEBE2;--lime:#B4FF00;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--ink); color:var(--paper);
    font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1.25rem;
    text-align:center; padding:2rem;
  }
  img{width:48px;height:auto;opacity:0.9;}
  h1{font-size:clamp(3rem,12vw,7rem); font-weight:700; letter-spacing:-0.03em; color:var(--lime);}
  p{opacity:0.6; font-size:0.9rem; letter-spacing:0.02em;}
  a{
    color:var(--paper); text-decoration:none;
    border-bottom:1px solid currentColor; padding-bottom:2px; font-size:0.95rem;
  }
</style>
</head>
<body>
  <img src="/img/dth-logo.png" alt="DTH">
  <h1>404</h1>
  <p>Page not found / Página no encontrada</p>
  <a href="/">delatouch.com</a>
</body>
</html>
